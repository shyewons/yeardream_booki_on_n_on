<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>목장</title>
<style>
  /* 화면 3개: [목장: 책 목록] → [책: 날짜 목록] → [글: 문장 목록]. 데이터는 /api/... 에서 불러온다 */
  :root {
    --bg: #f6f7f9; --fg: #1b2330; --muted: #5d6878; --line: #d3d9e2; --card: #ffffff;
    --accent: #1f5fbf; --accent-fg: #ffffff; --soft: #e8f0fc;
    --ok: #1d7a46; --ok-bg: #e6f4ec; --warn: #8a4b00; --warn-bg: #fff4e0; --err: #b3261e; --err-bg: #fdecea;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --fg: #e6ebf2; --muted: #9aa5b5; --line: #374052; --card: #1a2029;
      --accent: #6aa2ff; --accent-fg: #0d1522; --soft: #1d2b44;
      --ok: #62c58b; --ok-bg: #16281e; --warn: #f0b868; --warn-bg: #2a2012; --err: #ff8a80; --err-bg: #2d1715;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #app { max-width: 720px; margin: 0 auto; padding-bottom: 48px; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { padding-block: 18px 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
  header { align-items: center; min-height: 40px; }
  #nav, #side { display: flex; flex-wrap: wrap; gap: 8px; }
  #side { margin-left: auto; }
  /* ---- 새로운 이야기: 종류 고르기 · 이름 짓기 ---- */
  .kinds { list-style: none; margin: 14px 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .kind { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; height: 100%; padding: 22px 12px;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--fg); }
  .kind:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--soft); }
  .kind .big { font-size: 1.3rem; font-weight: 700; }
  .kind .emo { font-size: 2.2rem; line-height: 1.1; }
  .name-form { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
               border-radius: 14px; padding: 18px; margin: 14px 0; }
  .name-form label { font-weight: 600; }
  .name-form input { font: inherit; font-size: 1.1rem; padding: 8px 10px; width: 100%; max-width: 20em; border: 1px solid var(--line);
                     border-radius: 8px; background: var(--bg); color: var(--fg); }
  .name-form .msg { color: var(--err); margin: 0; min-height: 1.4em; }
  .cta { text-align: center; padding: 28px 0; }
  .cta p { font-size: 1.15rem; font-weight: 600; margin: 0 0 12px; }
  .btn.off { opacity: .4; pointer-events: none; }
  .actions-row.three { justify-content: center; }

  h1 { font-size: 1.35rem; margin: 10px 0 2px; text-wrap: balance; overflow-wrap: anywhere; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: .92rem; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .pill { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }

  #banner { background: var(--err-bg); color: var(--err); border-radius: 8px; padding: 10px 14px; margin: 10px 0; overflow-wrap: anywhere; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 6px 14px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- 목장 ---- */
  .shelf { list-style: none; margin: 8px 0 18px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }   /* 한 줄에 3권, 한 쪽 6권(서버의 PAGE_SIZE_BOOKS) */
  .shelf > li { min-width: 0; }
  .book .since { font-size: .78rem; color: var(--muted); }
  @media (max-width: 420px) { .shelf { gap: 8px; } .book { padding: 12px 4px; } }
  .book { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; height: 100%;
          background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 10px; text-decoration: none; color: var(--fg); }
  .book:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--soft); }
  .book .cover { font-size: 2.4rem; line-height: 1.1; }
  .book .name { font-weight: 700; overflow-wrap: anywhere; }

  /* ---- 날짜 목록 ---- */
  .finder { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .finder input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  .hint { color: var(--muted); font-size: .9rem; }
  .rows { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; background: var(--card); border: 1px solid var(--line);
         border-radius: 10px; padding: 10px 14px; text-decoration: none; color: var(--fg); }
  .row:hover { border-color: var(--accent); }
  .row .d { font-weight: 600; flex: 1; min-width: 9em; }
  .row .n { color: var(--muted); font-size: .88rem; }

  /* ---- 쪽 이동 ---- */
  .pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 6px 0 4px; }
  .pg { min-width: 2.4em; text-align: center; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
        text-decoration: none; color: var(--fg); }
  a.pg:hover { border-color: var(--accent); }
  .pg[aria-current="page"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
  .pg.off { opacity: .4; }
  .gap { padding: 4px 2px; color: var(--muted); }
  .count { text-align: center; color: var(--muted); font-size: .88rem; margin: 4px 0 0; }

  /* ---- 글(문장 목록) ---- */
  .draft { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; overflow-wrap: anywhere; }
  .sents { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .card .no { font-weight: 700; color: var(--muted); min-width: 1.6em; }
  .card .text { font-size: 1.12rem; margin: 6px 0 0; overflow-wrap: anywhere; }
  .card .orig { color: var(--muted); font-size: .88rem; margin: 2px 0 0; overflow-wrap: anywhere; }
  details.fix { margin-top: 8px; }
  details.fix summary { cursor: pointer; color: var(--accent); font-size: .92rem; }
  .fix .item { margin: 10px 0 0; padding-left: 10px; border-left: 3px solid var(--line); }
  .fix .what { margin: 0 0 2px; font-weight: 600; }
  .fix .exp { margin: 0; white-space: pre-line; font-size: .94rem; }
  .fix .ev { margin: 2px 0 0; color: var(--muted); font-size: .8rem; }
  /* ---- 글쓰기 화면으로 가는 버튼 · 저장 결과 ---- */
  a.btn { display: inline-block; text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { color: var(--accent-fg); filter: brightness(1.08); }
  .start { margin: 0 0 12px; }
  .actions-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 18px 0 0; }
  .saved { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 14px; margin: 6px 0 12px; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <header>
    <nav id="nav" aria-label="이동"></nav>        <!-- 왼쪽: 한 단계 뒤로 (목장으로 / 목록으로 / 뒤로) -->
    <div id="side"></div>                         <!-- 오른쪽: 목장의 '+ 새로운 이야기', 글 화면의 '목장으로' -->
  </header>
  <div id="banner" role="alert" hidden></div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
const view = document.getElementById('view');
const nav = document.getElementById('nav');
const side = document.getElementById('side');
let lastShelf = 1;                                  // 마지막으로 본 목장 쪽 ('목장으로'를 누르면 그 쪽으로 돌아간다)
const banner = document.getElementById('banner');

/* 글자는 항상 textContent 로 넣는다 (아이가 쓴 글이 화면 코드로 해석되지 않게) */
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(path, body) {
  let r;
  try { r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch { const e = new Error('서버에 연결하지 못했어요.'); e.status = 0; throw e; }
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).detail || ''; } catch {}
    const e = new Error(detail || `오류가 났어요 (${r.status})`);
    e.status = r.status;
    throw e;
  }
  return r.json();
}

/* ---------- 보기 좋게 바꾸는 함수 ---------- */
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
function fmtDate(s) {
  if (!s) return '이야기';
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  return `${y}-${pad(m)}-${pad(d)} (${WEEK[new Date(y, m - 1, d).getDay()]})`;
}
const fmtTime = s => (s ? String(s).replace('T', ' ').slice(0, 16) : '');
const todayKST = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date());   // 2026-11-14
const KIND = { diary: '일기', fairy: '동화' };
const COVER = { sheep: '🐑', alpaca: '🦙' };
const statusPill = st => h('span', { class: st === 'done' ? 'pill ok' : 'pill warn', text: st === 'done' ? '완성' : '쓰는 중' });

/* ---------- 쪽 이동 ---------- */
function pageNumbers(p, n) {
  if (n <= 9) return Array.from({ length: n }, (_, i) => i + 1);
  const keep = new Set([1, n]);
  for (let i = p - 2; i <= p + 2; i++) if (i > 1 && i < n) keep.add(i);
  const out = []; let prev = 0;
  for (const x of [...keep].sort((a, b) => a - b)) { if (x - prev > 1) out.push('…'); out.push(x); prev = x; }
  return out;
}
function pager(data, hrefFor, unit) {
  const { page, total_pages: n, total } = data;
  if (!n) return null;
  const pg = (label, to, off, current) => off
    ? h('span', { class: 'pg off', text: label })
    : h('a', { class: 'pg', href: hrefFor(to), 'aria-current': current ? 'page' : null, text: label });
  return h('div', {},
    n > 1 ? h('nav', { class: 'pager', 'aria-label': '쪽 이동' },
      pg('«', 1, page <= 1), pg('◀ 이전', page - 1, page <= 1),
      pageNumbers(page, n).map(x => x === '…' ? h('span', { class: 'gap', text: '…' }) : pg(String(x), x, false, x === page)),
      pg('다음 ▶', page + 1, page >= n), pg('»', n, page >= n)) : null,
    h('p', { class: 'count', text: `${page} / ${n}쪽 · 전체 ${total}${unit}` }));
}

/* ---------- 화면 1: 목장 ---------- */
async function shelfView(page) {
  const data = await api(`/api/books?page=${page}`);
  if (data.total_pages && page > data.total_pages) { location.replace(`#shelf/${data.total_pages}`); return null; }
  lastShelf = page;
  const farm = data.owner ? `${data.owner}의 목장` : '목장';          // 별명은 서버가 알려 준다 (지금은 더미 사용자)
  const node = h('div', {},
    h('h1', { text: farm }),
    data.total ? h('p', { class: 'sub', text: '친구를 눌러 들려준 이야기를 열어 보세요.' }) : null,
    data.items.length
      ? h('ul', { class: 'shelf' }, data.items.map(b => h('li', {},
          h('a', { class: 'book', href: `#book/${b.id}/1` },
            h('span', { class: 'cover', 'aria-hidden': 'true', text: COVER[b.cover] || '📖' }),
            h('span', { class: 'name', text: b.title }),
            h('span', { class: 'pill', text: KIND[b.kind] || b.kind }),
            b.created_at ? h('span', { class: 'since', text: `목장에 온 날 ${String(b.created_at).slice(0, 10)}` }) : null))))
      : h('div', { class: 'cta' }, h('p', { text: '첫 이야기를 시작해 볼까요?' }), h('a', { class: 'btn primary', href: '#new', text: '+ 새로운 이야기' })),
    pager(data, p => `#shelf/${p}`, '마리'));
  return { node, side: data.total ? [{ label: '+ 새로운 이야기', href: '#new', primary: true }] : [], title: farm };
}

/* ---------- 새로운 이야기 1: 종류 고르기 (일기 / 동화) ---------- */
function kindView() {
  const node = h('div', {},
    h('h1', { text: '어떤 이야기를 들려줄까요?' }),
    h('p', { class: 'sub', text: '쓰고 싶은 이야기를 눌러 주세요.' }),
    h('ul', { class: 'kinds' },
      h('li', {}, h('a', { class: 'kind', href: '#new/diary' },
        h('span', { class: 'emo', 'aria-hidden': 'true', text: '☀️' }), h('span', { class: 'big', text: '일기' }), h('span', { text: '오늘 있었던 일을 써요.' }))),
      h('li', {}, h('a', { class: 'kind', href: '#new/fairy' },
        h('span', { class: 'emo', 'aria-hidden': 'true', text: '⭐' }), h('span', { class: 'big', text: '동화' }), h('span', { text: '상상한 이야기를 써요.' })))));
  return { node, back: { label: '← 목장으로', href: `#shelf/${lastShelf}` }, title: '새로운 이야기' };
}

/* ---------- 새로운 이야기 2: 동물(책) 이름 짓기 → 책을 만들고 바로 쓰기 화면으로 ---------- */
function nameView(kind) {
  if (!KIND[kind]) { location.replace('#new'); return null; }
  const input = h('input', { id: 'pet-name', type: 'text', maxlength: '20', autocomplete: 'off', placeholder: '이름을 적어 주세요' });
  const msg = h('p', { class: 'msg', role: 'alert' });
  const go = h('button', { class: 'btn primary', type: 'submit', text: '이야기 시작하기' });
  const form = h('form', { class: 'name-form', onsubmit: async (ev) => {
    ev.preventDefault();
    const title = input.value.trim();
    if (!title) { msg.textContent = '친구의 이름을 적어 주세요.'; input.focus(); return; }
    msg.textContent = ''; go.disabled = true;
    try {
      const b = await api('/api/books', { kind, title });
      location.href = `/?book=${b.id}` + (kind === 'diary' ? `&date=${todayKST()}` : '');
    } catch (e) { msg.textContent = e.message; go.disabled = false; }
  } }, h('label', { for: 'pet-name', text: '동물 이름' }), input, msg, go);
  const node = h('div', {},
    h('h1', {}, '친구의 이름을 지어 주세요. ', h('span', { class: 'pill', text: KIND[kind] })),
    h('p', { class: 'sub', text: `${KIND[kind]}에 함께할 친구의 이름을 지어 보세요.` }),
    form);
  setTimeout(() => input.focus(), 0);
  return { node, back: { label: '← 뒤로', href: '#new' }, title: '친구 이름 짓기' };
}

/* ---------- 화면 2: 책 안의 글(날짜) 목록 ---------- */
async function bookView(id, page) {
  const data = await api(`/api/books/${id}/entries?page=${page}`);
  if (data.total_pages && page > data.total_pages) { location.replace(`#book/${id}/${data.total_pages}`); return null; }
  const { book } = data;
  const isDiary = book.kind === 'diary';

  let finder = null;
  if (isDiary) {
    const input = h('input', { type: 'date', 'aria-label': '날짜 선택' });
    const msg = h('span', { class: 'hint', role: 'status' });
    finder = h('div', { class: 'finder' }, input,
      h('button', { class: 'btn', type: 'button', text: '날짜로 찾기', onclick: async () => {
        if (!input.value) { msg.textContent = '날짜를 골라 주세요.'; return; }
        msg.textContent = '';
        try {
          const d = await api(`/api/books/${id}/diary/${input.value}`);
          location.hash = `entry/${d.entry.id}/${id}/${page}`;
        } catch (e) {
          if (e.status === 404) {
            msg.replaceChildren('그 날짜에는 일기가 없어요. ',
              input.value <= todayKST() ? h('a', { href: `/?book=${id}&date=${input.value}`, text: '이 날짜로 쓰기' }) : '');
          } else msg.textContent = e.message;
        }
      } }), msg);
  }

  // 쓰기 버튼: 일기는 '새 일기 쓰기'(오늘) + 쓰던 일기가 있으면 '이어서 쓰기', 동화는 책 하나에 이야기 한 편
  const w = data.writing, today = todayKST();
  const wDate = w && w.date ? String(w.date).slice(0, 10) : null;
  const starts = isDiary
    ? [wDate === today
        ? h('a', { class: 'btn primary', href: `/?book=${id}&date=${today}`, text: '오늘 일기 이어서 쓰기' })
        : h('a', { class: 'btn primary', href: `/?book=${id}&date=${today}`, text: '새 일기 쓰기' }),
       w && wDate !== today ? h('a', { class: 'btn', href: `/?book=${id}&date=${wDate}`, text: `이어서 쓰기 (${fmtDate(wDate)})` }) : null]
    : [h('a', { class: 'btn primary', href: `/?book=${id}`, text: data.total ? '이야기 이어서 쓰기' : '이야기 쓰기' })];
  const node = h('div', {},
    h('h1', {}, `${COVER[book.cover] || '📖'} ${book.title}에게 들려준 이야기 `, h('span', { class: 'pill', text: KIND[book.kind] || book.kind })),
    h('p', { class: 'sub', text: !data.total ? '' : isDiary ? '읽고 싶은 날짜를 눌러 주세요.' : '이야기를 눌러 읽어 보세요.' }),
    h('p', { class: 'start actions-row' }, starts),
    finder,
    data.items.length
      ? h('ul', { class: 'rows' }, data.items.map(e => h('li', {},
          h('a', { class: 'row', href: `#entry/${e.id}/${id}/${page}` },
            h('span', { class: 'd', text: fmtDate(e.date) }),
            statusPill(e.status),
            h('span', { class: 'n', text: `문장 ${e.sentence_count}개` })))))
      : h('p', { class: 'empty', text: '아직 들려준 이야기가 없어요.' }),
    pager(data, p => `#book/${id}/${p}`, isDiary ? '일' : '편'));
  return { node, back: { label: '← 목장으로', href: `#shelf/${lastShelf}` }, title: book.title };
}

/* ---------- 화면 3: 글 하나 (문장 목록) ---------- */
async function entryView(id, bookId, page, saved) {
  const data = await api(`/api/entries/${id}`);
  const { book, entry, sentences } = data;
  const back = `#book/${bookId || book.id}/${page || 1}`;
  const label = fmtDate(entry.date);
  // 처음 쓴 시각 = 글이 처음 만들어진 때, 마지막 수정 = 문장을 고친 때와 '이야기 저장하기'를 누른 때 중 나중 것
  const last = [fmtTime(entry.edited_at), fmtTime(entry.saved_at)].sort().pop();
  const when = [entry.created_at && `처음 쓴 시각 ${fmtTime(entry.created_at)}`, last && `마지막 수정 ${last}`].filter(Boolean).join(' · ');

  // 이전 이야기 = 더 오래된 글, 다음 이야기 = 더 새 글 (없으면 흐리게)
  const near = (text, to) => to ? h('a', { class: 'btn', href: `#entry/${to}/${bookId || book.id}/${page || 1}`, text })
                                : h('span', { class: 'btn off', 'aria-disabled': 'true', text });
  const writeHref = `/?book=${bookId || book.id}` + (entry.date ? `&date=${entry.date}` : '');
  if (saved) history.replaceState(null, '', `#entry/${id}/${bookId || book.id}/${page || 1}`);   // 새로고침해도 '저장했어요'가 또 뜨지 않게
  const node = h('div', {},
    saved ? h('p', { class: 'saved', role: 'status', text: '✔ 이야기를 저장했어요!' }) : null,
    h('h1', {}, `${label} `, statusPill(entry.status)),
    h('p', { class: 'sub', text: `${book.title}${when ? ' · ' + when : ''}` }),
    entry.draft_text ? h('p', { class: 'draft', text: `쓰다가 멈춘 문장: ${entry.draft_text}` }) : null,
    sentences.length
      ? h('ol', { class: 'sents' }, sentences.map(s => h('li', { class: 'card' },
          h('div', { class: 'top' },
            h('span', { class: 'no', text: String(s.seq) }),
            s.has_correction ? h('span', { class: 'pill ok', text: '고쳤어요' }) : null,
            s.attempt_count > 1 ? h('span', { class: 'pill warn', text: `${s.attempt_count}번 만에 통과` }) : null),
          h('p', { class: 'text', text: s.revised }),
          s.has_correction && s.original !== s.revised ? h('p', { class: 'orig', text: `처음에 쓴 문장: ${s.original}` }) : null,
          s.expression_choice && s.expression_choice.picked ? h('p', { class: 'orig', text: '내가 고른 표현이에요.' }) : null,
          s.corrections.length
            ? h('details', { class: 'fix' },
                h('summary', { text: `고친 곳 ${s.corrections.length}군데` }),
                s.corrections.map(c => h('div', { class: 'item' },
                  h('p', { class: 'what', text: `${c.before} → ${c.after}` }),
                  c.explanation ? h('p', { class: 'exp', text: c.explanation }) : null,
                  c.evidence ? h('p', { class: 'ev', text: `근거: ${[c.evidence.article, c.evidence.page != null ? c.evidence.page + '쪽' : null].filter(Boolean).join(' ')}` }) : null)))
            : null)))
      : h('p', { class: 'empty', text: '아직 쓴 문장이 없어요.' }),
    h('div', { class: 'actions-row three' },
      near('이전 이야기', data.nav && data.nav.prev),
      h('a', { class: 'btn primary', href: writeHref, text: entry.status === 'done' ? '고쳐쓰기' : '이어서 쓰기' }),
      near('다음 이야기', data.nav && data.nav.next)));
  return { node, back: { label: '← 목록으로', href: back }, side: [{ label: '목장으로', href: `#shelf/${lastShelf}` }], title: `${book.title} ${label}` };
}

/* ---------- 주소(#...)에 따라 화면 바꾸기 ---------- */
function setHeader(r) {
  nav.replaceChildren(...(r.back ? [h('a', { class: 'btn', href: r.back.href, text: r.back.label })] : []));
  side.replaceChildren(...(r.side || []).map(b => h('a', { class: b.primary ? 'btn primary' : 'btn', href: b.href, text: b.label })));
}
function showError(e) {
  banner.textContent = e.status === 503 ? `서버가 DB에 연결하지 못했어요. ${e.message}`
    : e.status === 404 ? '찾을 수 없어요. 지워졌거나 내 것이 아닌 것 같아요.' : e.message;
  banner.hidden = false;
  view.replaceChildren(h('p', { class: 'empty' },
    h('button', { class: 'btn', type: 'button', text: '다시 시도', onclick: route }), ' ',
    h('a', { href: '#shelf/1', text: '목장으로' })));
  setHeader({ back: { label: '← 목장으로', href: '#shelf/1' } });
}

let seq = 0;
async function route() {
  const my = ++seq;
  const [name, a, b, c, d] = (location.hash.slice(1) || 'shelf/1').split('/');
  banner.hidden = true;
  view.replaceChildren(h('p', { class: 'empty', text: '불러오는 중…' }));
  try {
    let r;
    if (name === 'book') r = await bookView(+a, +b || 1);
    else if (name === 'entry') r = await entryView(+a, +b, +c || 1, d === 'saved');
    else if (name === 'new') r = a ? nameView(a) : kindView();
    else r = await shelfView(+a || 1);
    if (my !== seq || !r) return;                 // 그 사이에 다른 화면으로 옮겼거나, 쪽 번호를 고쳐 다시 부르는 중
    setHeader(r);
    document.title = r.title;
    view.replaceChildren(r.node);
    window.scrollTo(0, 0);
  } catch (e) {
    if (my === seq) showError(e);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
